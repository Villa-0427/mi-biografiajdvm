name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Habilitar pnpm
        run: corepack enable

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Construir la pagina
        working-directory: artifacts/biografia-timeline
        env:
          PORT: "5173"
          BASE_PATH: "/${{ github.event.repository.name }}/"
        run: pnpm build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir los archivos generados
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/biografia-timeline/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
